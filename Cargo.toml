[package]
name = "acadifc"
version = "0.5.0"
edition = "2021"
authors = ["Hakan AK"]
description = "IFC support for CAD drawings: package handling, canonicalisation, conformance, and conversion between IFC and DWG/DXF."
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/acadifc"
homepage = "https://github.com/OpenAEC-Foundation/acadifc"
documentation = "https://docs.rs/acadifc"
readme = "README.md"
keywords = ["cad", "ifc", "bim", "dxf", "dwg"]
categories = ["parser-implementations", "encoding"]

[features]
default = []
# Forwarded so the re-exported codec types stay serialisable through here.
serde = ["cadcodec/serde"]
import = ["cadcodec/import"]
# Polyline offsetting. Forwarded rather than always on, so a consumer that
# only needs IFC or the codec does not pull cavalier_contours in.
offset = ["cadkernel/offset"]

[dependencies]
# The DWG/DXF/ACIS codec, re-exported from the crate root so consumers reach
# the CAD side through this crate. It keeps the `acadrust` package name it
# was forked with — the repository is cadcodec, the package is not, and the
# alias below is what the rest of this crate reads.
cadcodec = { package = "acadrust", git = "https://github.com/HakanSeven12/cadcodec.git", rev = "36e841f" }

# Geometry kernel. IFC conversion is geometry work — IfcAdvancedBrep carries
# NURBS surfaces, IfcExtrudedAreaSolid is a sweep, profiles are 2D curves.
cadkernel = { git = "https://github.com/HakanSeven12/cadkernel.git", rev = "691c477", features = ["brep"] }

# Error handling
thiserror = "1.0"

# IFC package handling: manifests, canonicalisation, blob digests
base64 = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
