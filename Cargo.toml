[package]
name = "acadifc"
version = "0.5.0"
edition = "2021"
authors = ["Hakan AK"]
description = "Rust foundations for IFCCAD packages, canonicalisation and conformance"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/acadifc"
homepage = "https://github.com/OpenAEC-Foundation/acadifc"
documentation = "https://docs.rs/acadifc"
readme = "README.md"
keywords = ["cad", "ifc", "ifccad", "bim", "conformance"]
categories = ["parser-implementations", "encoding"]

[features]
default = []

[dependencies]
# Error handling
thiserror = "1.0"

# IFCCAD package handling: manifests, canonicalisation, blob digests
base64 = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
